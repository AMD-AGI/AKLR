[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "aklr"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
]
# torch and triton come with the environment, as do aiter and sglang, which only the
# baselines and the sglang plugin import.
dependencies = [
    "flydsl>=0.3.2",
    "ninja",
    "packaging",
    "pydantic>=2.12",
    "safetensors",
]

[project.entry-points."sglang.srt.plugins"]
aklr = "aklr.core.runtime.dispatch:register_sglang_plugin"

[project.entry-points."vllm.general_plugins"]
aklr = "aklr.core.runtime.dispatch:register_vllm_plugin"

[tool.setuptools.packages.find]
include = ["aklr", "aklr.*"]

[tool.setuptools.package-data]
"aklr.ops" = ["*/impls/*/*/*.json"]

# The version is AKLR's commit: 0.1.devN+g<sha> before the first tag.
[tool.setuptools_scm]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["B", "F", "I", "W"]
ignore = [
    # F403/F405: package __init__ files use intentional star-imports for API aggregation.
    "F403",
    "F405",
    # B905: zip(..., strict=) requires py3.10+ everywhere; revisit as a separate sweep.
    "B905",
    # B007: unused loop control variable is common and low-risk here.
    "B007",
    # B028: explicit stacklevel on every warnings.warn is noisy; skip it.
    "B028",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
concurrency = ["multiprocessing", "thread"]
source = ["aklr"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
# Python line coverage does not measure JIT kernel bodies.
omit = [
    "aklr/ops/*/impls/*",
]

[tool.coverage.paths]
aklr = ["aklr/", "*/aklr/"]
