# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Install
# 1. pip install -r requirements.txt
# 2. pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      # Checks every recipe, not only the changed ones: a schema edit can break the others.
      - id: agentx-recipes
        name: check AgentX serving recipes
        entry: python benchmarks/agentx/agentx_bench.py check-recipes
        language: python
        additional_dependencies: [pyyaml==6.0.3, jsonschema==4.25.1]
        files: ^benchmarks/agentx/(recipes/|agentx\.yaml$)
        pass_filenames: false
      # Checks the whole book, not only the changed pages: an edit can break another page's link or section number.
      - id: kernel-optimization-book
        name: lint the kernel optimization book
        entry: python harness/skills/kernel-optimization-book/maintenance/kb_lint.py --errors-only
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^harness/skills/kernel-optimization-book/
        pass_filenames: false
      - id: kernel-optimization-book-indexes
        name: check the generated indexes of the kernel optimization book
        entry: python harness/skills/kernel-optimization-book/maintenance/kb_index.py --check
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^harness/skills/kernel-optimization-book/
        pass_filenames: false
      - id: tests-layout
        name: tests layout (tests/AGENTS.md)
        entry: python3 tests/check_layout.py
        language: system
        pass_filenames: false
        files: ^(tests|aklr)/
