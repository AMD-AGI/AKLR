# Keep these versions aligned with requirements-dev.txt and pyproject.toml.
minimum_pre_commit_version: "4.6.0"
# AITER sources are maintained separately; formatting hooks skip them entirely.
exclude: ^aiter/
repos:
  - repo: local
    hooks:
      - id: warn-aiter-changes
        name: AITER path warning (advisory)
        entry: python3 .github/scripts/warn_aiter_changes.py staged
        language: system
        # Read the index directly, even when every staged file was excluded.
        always_run: true
        pass_filenames: false
        verbose: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --no-unsafe-fixes]
        types_or: [python, pyi]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        types_or: [python, pyi]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.6
    hooks:
      - id: clang-format
        args: [--style=file]
        files: \.(cpp|c|cc|cu|h|hpp|cuh)$
