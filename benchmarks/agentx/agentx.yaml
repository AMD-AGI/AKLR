# A run is one model, target and serving framework. Each framework's recipe_source tells the recipe
# module where to take its serving.json from; plan reads only the reviewed
# recipes/<family>/<target>/<framework>/serving.<model>.json.
models:
  glm52-fp4:
    enabled: true
    display_name: GLM-5.2 MXFP4
    family: GLM
    precision: mxfp4
    weights:
      repo: amd/GLM-5.2-MXFP4
      revision: 386bd0e4ec821f7b07975701cec3c3b953a5576a
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: agentx-mi355x
        frameworks:
          sglang:
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              ref: main
              config_key: glm5.2-fp4-mi355x-sglang-agentic-mtp
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/glm5.2/sglang/mi355x-fp4-mtp/agentic.yaml
                model: amd/GLM-5.2-MXFP4
                model-prefix: glm5.2
                framework: sglang
                runner_pattern: mi355x
  glm52-fp8:
    enabled: true
    display_name: GLM-5.2 FP8
    family: GLM
    precision: fp8
    weights:
      repo: zai-org/GLM-5.2-FP8
      revision: f33c6dc501ee5a2c7e35155653b1b1abbc320951
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: agentx-mi355x
        frameworks:
          sglang:
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              ref: main
              config_key: glm5.2-fp8-mi355x-sglang-agentic-mtp
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/glm5.2/sglang/mi355x-fp8-mtp/agentic.yaml
                model: zai-org/GLM-5.2-FP8
                model-prefix: glm5.2
                framework: sglang
                runner_pattern: mi355x
  minimaxm31flash-fp4:
    enabled: true
    display_name: MiniMax-M3.1-Flash MXFP4
    family: MiniMax
    precision: mxfp4
    weights:
      repo: amd/MiniMax-M3.1-Flash-Quark-MXFP4
      revision: bf06a0c566b430c620154497cc928c893af5e10c
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: agentx-mi355x
        frameworks:
          vllm:
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              ref: main
              config_key: minimaxm31flash-fp4-mi355x-vllm-agentic-dspark
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/minimaxm31flash/vllm/mi355x-fp4/agentic.yaml
                model: amd/MiniMax-M3.1-Flash-Quark-MXFP4
                model-prefix: minimaxm31flash
                framework: vllm
                runner_pattern: mi355x
report:
  repo_url: https://github.com/AMD-AGI/AKLR
