# A run is one model, target and serving framework. Each framework's recipe_source tells the recipe
# module where to take its serving.json from; plan reads only the reviewed
# recipes/<family>/<target>/<framework>/serving.<model>.json.
models:
  glm52-fp4:
    enabled: true
    display_name: GLM-5.2 MXFP4
    family: GLM
    precision: mxfp4
    weights:
      repo: amd/GLM-5.2-MXFP4
      revision: 386bd0e4ec821f7b07975701cec3c3b953a5576a
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: conductor-mi355x
        frameworks:
          sglang:
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              ref: main
              config_key: glm5.2-fp4-mi355x-sglang-agentic-mtp
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/glm5.2/sglang/mi355x-fp4-mtp/agentic.yaml
                model: amd/GLM-5.2-MXFP4
                model-prefix: glm5.2
                framework: sglang
                runner_pattern: mi355x
  glm52-fp8:
    enabled: true
    display_name: GLM-5.2 FP8
    family: GLM
    precision: fp8
    weights:
      repo: zai-org/GLM-5.2-FP8
      revision: f33c6dc501ee5a2c7e35155653b1b1abbc320951
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: conductor-mi355x
        frameworks:
          sglang:
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              ref: main
              config_key: glm5.2-fp8-mi355x-sglang-agentic-mtp
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/glm5.2/sglang/mi355x-fp8-mtp/agentic.yaml
                model: zai-org/GLM-5.2-FP8
                model-prefix: glm5.2
                framework: sglang
                runner_pattern: mi355x
  kimik3-fp4:
    enabled: true
    display_name: Kimi-K3 MXFP4
    family: Kimi
    precision: mxfp4
    weights:
      repo: moonshotai/Kimi-K3
      revision: f831ab66814297da540d832a5235f8e904f29d06
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: conductor-mi355x
        frameworks:
          vllm:
            # Both modes on stack.json's AITER: AKLR serves Kimi-K3's GEMMs, MoE and MLA through its aiter.plugin.
            aiter: stack
            recipe_source:
              kind: inferencex
              repo: SemiAnalysisAI/InferenceX
              # InferenceX has retired its Kimi-K3 lanes; this is the last commit that carries the entry.
              # The recipe differs from it in one launch variable: VLLM_ROCM_QUICK_REDUCE_QUANTIZATION is NONE,
              # not INT4, which the AITER in stack.json's vLLM image does not have.
              ref: 57116fff418d7bb651567e722907253a12b75a67
              config_key: kimik3-fp4-mi355x-vllm-agentic-mtp
              expect:
                config_file: inferencex-e2e/configs/amd-master.yaml
                recipe: inferencex-e2e/benchmarks/single_node/srt-slurm-recipes/kimik3/vllm/mi355x-fp4-mtp/agentic.yaml
                model: moonshotai/Kimi-K3
                model-prefix: kimik3
                framework: vllm
                runner_pattern: mi355x
          sglang:
            # Both modes on stack.json's AITER, as on vLLM.
            aiter: stack
            # The cookbook's command lacks the two server variables every InferenceX SGLang lane serves the AgentX
            # client with, and SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION, which InferenceX's MI355X SGLang recipes
            # set: without it SGLang 0.5.23 scales the cookbook's --mem-fraction-static 0.85 to 0.7225 under the
            # AITER backend, less than the weights take, and the server does not start.
            advisory_env:
              PYTHONNOUSERSITE: "1"
              SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: "1"
              SGLANG_TIMEOUT_KEEP_ALIVE: "900"
            recipe_source:
              # InferenceX has no SGLang lane for Kimi-K3: the cookbook's MI355X command, at the vLLM lane's
              # concurrencies.
              kind: cookbook
              framework: sglang
              url: https://docs.sglang.io/cookbook/autoregressive/Moonshotai/Kimi-K3
