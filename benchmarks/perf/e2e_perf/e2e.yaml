# Daily end-to-end performance. Each model × target × framework group is measured on its own, AKLR off
# then AKLR on on the same machine, and serves with recipes/<family>/<target>/<framework>/serving.<model>.json.
client: # Only InferenceX's infx.bench_serving, at a pinned commit.
  repo: SemiAnalysisAI/InferenceX
  sha: 8f29d8dc12329bb30a0300cd1c31f4e4cc2a19e4
workloads: # Each mode's server runs every workload in order, each at every one of its concurrencies.
  - id: 8k1k
    isl: 8192
    osl: 1024
    random_range_ratio: 1.0
    concurrency: [1, 2, 8, 16, 48]
    num_prompts_per_conc: 10 # 10 × conc prompts per point, as InferenceX fixed-seq runs
    warmups_per_conc: 2
    seed: 0
models:
  glm52-fp4:
    display_name: GLM-5.2 MXFP4
    family: GLM
    weights:
      repo: amd/GLM-5.2-MXFP4
      revision: 386bd0e4ec821f7b07975701cec3c3b953a5576a
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: agentx-mi355x
        frameworks: [sglang]
  glm52-fp8:
    display_name: GLM-5.2 FP8
    family: GLM
    weights:
      repo: zai-org/GLM-5.2-FP8
      revision: f33c6dc501ee5a2c7e35155653b1b1abbc320951
    targets:
      mi355x:
        hardware:
          gpu_name_pattern: '\bMI355X\b'
          gpu_arch: gfx950
          gpu_count: 8
        runner_label: agentx-mi355x
        frameworks: [sglang]
report:
  repo_url: https://github.com/AMD-AGI/AKLR
