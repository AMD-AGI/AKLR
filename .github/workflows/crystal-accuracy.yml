name: Crystal Correctness Qualification

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Same-repository AKLR PR number (native GPU CI must pass first)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: crystal-accuracy-pr-${{ inputs.pull_request }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: pr
        name: Resolve PR and verify native CI
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            const resolve = require('./.github/scripts/resolve_crystal_candidate.cjs');
            await resolve({github, context, core, prNumber: process.env.PR_NUMBER});

  build:
    needs: resolve
    # Isolated disposable build runner. It must not be the submission runner.
    runs-on: [self-hosted, aklr-crystal-build]
    environment: crystal-build
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Require pre-created private image package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api /orgs/AMD-AGI/packages/container/aklr-sglang --jq .visibility 2>/dev/null) || exit 1
          [[ "$visibility" == private ]] || { echo 'Private qualification package is required.'; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push exact candidate
        id: build
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          BASE_IMAGE: ${{ vars.CRYSTAL_SGLANG_BASE_IMAGE }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BASE_IMAGE" =~ ^lmsysorg/sglang:v0\.5\.22-rocm10-mi35x@sha256:[0-9a-f]{64}$ ]] || {
            echo 'Configure the approved digest-pinned SGLang base image.'; exit 1;
          }
          [[ $(git -C candidate rev-parse HEAD) == "$CANDIDATE_SHA" ]]
          # Build output stays on the isolated runner; never upload it to public Actions artifacts.
          if ! docker buildx build --push --platform linux/amd64 --provenance=false --sbom=false \
            --file control/docker/Dockerfile.sglang \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "AKLR_COMMIT=$CANDIDATE_SHA" \
            --tag "ghcr.io/amd-agi/aklr-sglang:pr-${CANDIDATE_SHA}-${GITHUB_RUN_ID}" \
            --metadata-file "$RUNNER_TEMP/crystal-image.json" candidate \
            >"$RUNNER_TEMP/crystal-build.log" 2>&1; then
            echo 'Candidate image build failed; contact the runner operator.'; exit 1
          fi
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/crystal-image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  submit:
    needs: [resolve, build]
    runs-on: [self-hosted, aklr-crystal-submit]
    environment: crystal-submit
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm PR still points at tested commit
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open' || pr.head.sha !== process.env.EXPECTED_SHA) {
              throw new Error('PR changed during build; start a new qualification.');
            }
      - name: Submit asynchronous qualification
        env:
          CRYSTAL_URL: ${{ secrets.CRYSTAL_URL }}
          CRYSTAL_AKLR_SUBMISSION_SECRET: ${{ secrets.CRYSTAL_AKLR_SUBMISSION_SECRET }}
          PR_NUMBER: ${{ inputs.pull_request }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python3 .github/scripts/submit_crystal_qualification.py \
            --crystal-url "$CRYSTAL_URL" --request-id "aklr-${GITHUB_RUN_ID}" \
            --pull-request "$PR_NUMBER" --commit-sha "$CANDIDATE_SHA" \
            --image "ghcr.io/amd-agi/aklr-sglang@${IMAGE_DIGEST}" \
            --profile-id aklr-sglang-v1 \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
