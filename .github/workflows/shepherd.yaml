name: shepherd

# Forward issue events to the shepherd host's event queue; the host's shepherd-round service runs the round.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  forward:
    # Each event starts a paid round, so only issues a repository member or collaborator opened, or a shepherd
    # label change (which needs triage access), are forwarded. The round still checks the requesters team.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'shepherd'
      || (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
          && (startsWith(github.event.issue.title, 'shepherd:')
              || contains(github.event.issue.labels.*.name, 'shepherd')))
    runs-on: aklr-claude
    timeout-minutes: 2
    steps:
      - name: Queue the event
        env:
          EVENTS: ${{ vars.SHEPHERD_EVENTS_DIR }}
          ISSUE: ${{ github.event.issue.number || 0 }}
          ACTION: ${{ github.event.action || 'dispatch' }}
        run: |
          test -d "$EVENTS" || { echo "SHEPHERD_EVENTS_DIR is not a directory on this runner" >&2; exit 1; }
          printf '%s %s\n' "$ISSUE" "$ACTION" > "$EVENTS/$(date +%s%N)-$GITHUB_RUN_ID"
