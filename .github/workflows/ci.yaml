name: AKLR-CI

env:
  PYTHONDONTWRITEBYTECODE: '1'
  # Select exactly one backend. SaFE remains the default; the direct PR label takes precedence.
  AKLR_GPU_RUNNER: >-
    ${{ inputs.gpu_runner ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'ci:gpu-direct') && 'aklr-gpu') ||
        'aklr-safe' }}
  # The SaFE workload priority. A PR run yields to main's, which takes the published measurements;
  # ci:priority-high raises a PR run. A name, not SaFE's number: 0 is false in an expression.
  AKLR_GPU_PRIORITY: >-
    ${{ inputs.gpu_priority ||
        ((github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'ci:priority-high')) && 'high') ||
        'medium' }}
  # The publish-measurement bot's rolling PR: sent and opened by the bot, from aklr-perf/main of
  # this repository. perf-guard.yaml spells the same expression.
  AKLR_BOT_PR: >-
    ${{ github.event_name == 'pull_request' && vars.AKLR_BOT_LOGIN != '' &&
    github.event.sender.login == vars.AKLR_BOT_LOGIN && github.event.pull_request.user.login == vars.AKLR_BOT_LOGIN &&
    github.head_ref == 'aklr-perf/main' && github.event.pull_request.head.repo.full_name == github.repository }}
  # The one "still current" rule, run by main's own code: a measurement taken at commit
  # argv[1] stands iff the working tree differs from it only in what the bench
  # re-measures nothing for (all but aklr/core's code and stack.json, ValidationScope.path_kind).
  # Callers keep scratch files under $RUNNER_TEMP: an untracked file counts as a change.
  AKLR_MEASUREMENT_CURRENT: |
    import sys
    from aklr.core.validation.stages.validation_scope import ValidationScope
    scope = ValidationScope.of_working_tree(sys.argv[1], None)
    sys.exit("core" in map(scope.path_kind, scope.changed_paths()))

on:
  workflow_dispatch:
    inputs:
      gpu_runner:
        description: GPU execution backend (choose one)
        type: choice
        options:
          - aklr-safe
          - aklr-gpu
        default: aklr-safe
      gpu_priority:
        description: SaFE workload priority (aklr-safe only)
        type: choice
        options:
          - medium
          - high
        default: medium
      full_lint:
        description: Check all files, including inherited formatting debt
        type: boolean
        default: false
  push:
    branches: [main]

  # Only PRs into main: a stacked PR's base branch is author-controlled.
  # labeled/unlabeled apply the GPU backend selection; any label change restarts the run.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A PR update cancels its older run. Pushes and dispatches never cancel a running run,
# but a newer one replaces a pending one (one pending run per group; see Select lint range).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The audit gate rejects invalid schemas, audit violations and mixed changes
  # before any GPU job starts.
  code-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      # Forks too: the repository's Actions settings hold an external contributor's run for approval.
      GPU_ENABLED: >-
        ${{ github.event_name != 'pull_request' ||
            contains(github.event.pull_request.labels.*.name, 'ci:gpu') ||
            contains(github.event.pull_request.labels.*.name, 'ci:gpu-direct') }}
    outputs:
      gpu_enabled: ${{ env.GPU_ENABLED }}
      gpu_runner: ${{ env.AKLR_GPU_RUNNER }}
      reference_contracts: ${{ steps.reference_scope.outputs.contracts }}
      has_bench_paths: ${{ steps.audit.outputs.has_bench_paths }}
      validation_base: ${{ steps.lint.outputs.validation_base }}
      measured_by_bot: ${{ steps.lint.outputs.measured_by_bot }}
      sglang_image: ${{ steps.stack.outputs.sglang_image }}
      vllm_image: ${{ steps.stack.outputs.vllm_image }}
      aiter_image: ${{ steps.stack.outputs.aiter_image }}
      aiter: ${{ steps.stack.outputs.aiter }}
    steps:
      - name: Report whether GPU jobs run
        run: |
          if [[ $GPU_ENABLED == true ]]; then
            [[ $AKLR_GPU_RUNNER != aklr-safe ]] || priority=" at $AKLR_GPU_PRIORITY priority"
            echo "🟢 GPU jobs use $AKLR_GPU_RUNNER${priority:-}: aiter-test, sglang-test and vllm-test." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '⏭️ PR GPU jobs require ci:gpu (SaFE) or ci:gpu-direct (local Docker).' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout source and lint history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The test jobs' images and the baseline AITER (ROCm/aiter at this commit, installed in
      # aiter-test); the test jobs read them from this job's outputs.
      - name: Read stack.json
        id: stack
        run: |
          image='select(test("^[A-Za-z0-9._/:@-]+$"))'
          sglang_image=$(jq -er ".sglang_image | $image" stack.json)
          vllm_image=$(jq -er ".vllm_image | $image" stack.json)
          aiter_image=$(jq -er ".aiter_image | $image" stack.json)
          aiter=$(jq -er '.aiter | select(test("^[0-9a-f]{40}$"))' stack.json)
          {
            echo "sglang_image=$sglang_image"
            echo "vllm_image=$vllm_image"
            echo "aiter_image=$aiter_image"
            echo "aiter=$aiter"
          } >> "$GITHUB_OUTPUT"
          echo "🧱 Stack: aiter-test $aiter_image, ROCm/aiter@$aiter; sglang-test $sglang_image; vllm-test $vllm_image" | tee -a "$GITHUB_STEP_SUMMARY"
      - &setup_python
        name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tree has existing lint findings. Apply the pre-commit hooks to each
      # change only, without requiring a repository-wide reformat.
      - name: Select lint range
        id: lint
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          FULL_LINT: ${{ inputs.full_lint }}
          GH_TOKEN: ${{ github.token }}
          AKLR_BOT_LOGIN: ${{ vars.AKLR_BOT_LOGIN }}
        run: bash .github/scripts/select_lint_range.sh
      - name: Run pre-commit
        id: precommit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: ${{ steps.lint.outputs.args }}
      # export check and the audit load the default registry, which imports the ops' apis and torch.
      - &install_cpu_deps
        name: Install pydantic, CPU torch and ruff
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Covers main moving before this run only: GitHub does not re-run the bot PR's
      # checks when main moves later.
      - name: Check the bot PR's measurements are current
        if: env.AKLR_BOT_PR == 'true'
        run: |
          # HEAD is the merge commit; HEAD^2 the bot commit.
          shas=$(git log -1 --format='%(trailers:key=Measured-SHA,valueonly)' HEAD^2)
          [[ -n $shas ]] || { echo '::error::The bot commit has no Measured-SHA trailer'; exit 1; }
          for sha in $shas; do
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || { printf '::error::Malformed Measured-SHA %q\n' "$sha"; exit 1; }
            PYTHONPATH=. python -c "$AKLR_MEASUREMENT_CURRENT" "$sha" ||
              { echo "::error::Measured at $sha, before aklr/core or stack.json changes on main; a later publish-measurement rebuilds this PR without it"; exit 1; }
          done
      # CI only checks; authors export the schemas locally.
      - name: Check exported files
        id: export
        run: python -m aklr export check
      # A jq that decides the gate is its own assignment: inside echo, a failure would not stop the step.
      - name: Audit gate
        id: audit
        env:
          BASE: ${{ steps.lint.outputs.validation_base }}
          AUDIT_REPORT_DIR: ${{ runner.temp }}/audit-report
          MEASURED_BY_BOT: ${{ steps.lint.outputs.measured_by_bot }}
        run: |
          report="$AUDIT_REPORT_DIR/report.json"
          flags=(${BASE:+--base "$BASE"})
          [[ $MEASURED_BY_BOT != true ]] || flags+=(--allow-measured-edits)
          if python -m aklr validate "${flags[@]}" --stages audit --out "$AUDIT_REPORT_DIR"; then
            has_bench_paths=$(jq '.bench_paths | length > 0' "$report")
            echo "audit passed, $(jq '.schema_paths | length' "$report") schemas, $(jq '.bench_paths | length' "$report") to bench" >> "$GITHUB_STEP_SUMMARY"
            echo "has_bench_paths=$has_bench_paths" >> "$GITHUB_OUTPUT"
          else
            code=$?
            [[ ! -f $AUDIT_REPORT_DIR/report.md ]] || cat "$AUDIT_REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Select affected op reference tests
        id: reference_scope
        if: github.event_name == 'pull_request' && env.GPU_ENABLED == 'true'
        env:
          BASE: ${{ steps.lint.outputs.validation_base }}
        run: |
          contracts=$(PYTHONPATH=. python .github/scripts/reference_contracts.py "$BASE")
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "AITER op baseline/reference tests: ${contracts:-all contracts}" >> "$GITHUB_STEP_SUMMARY"

  # aiter-test: aklr/ops timed against the baseline AITER, in aiter_image; beside it sglang-test and
  # vllm-test. No secrets and no actions/cache: they run the PR's code and kernels.
  aiter-test:
    needs: code-lint
    if: needs.code-lint.outputs.gpu_enabled == 'true'
    runs-on: ${{ needs.code-lint.outputs.gpu_runner }}
    # A full validation (no base: a force push, a replaced run, a dispatch) benches every schema.
    # TIMEOUT_MINUTES limits the run on the GPU node; timeout-minutes also covers the wait for one.
    timeout-minutes: 480
    env:
      TIMEOUT_MINUTES: 180
      IMAGE: ${{ needs.code-lint.outputs.aiter_image }}
      TESTS: tests/core tests/ops tests/benchmarks
      AKLR_REFERENCE_CONTRACTS: ${{ needs.code-lint.outputs.reference_contracts }}
      AKLR_BASELINE_AITER: ${{ needs.code-lint.outputs.aiter }}
    steps:
      - &checkout_source
        name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - &gpu_tests
        name: Run unit tests (${{ env.TESTS }}) and validation on a GPU node
        shell: bash .github/scripts/gpu_job.sh {0}
        env:
          PASS_ENV: GITHUB_JOB TESTS VALIDATE BASE MEASURED_BY_BOT AKLR_BASELINE_AITER PLUGINS AKLR_REFERENCE_CONTRACTS
          VALIDATE: ${{ needs.code-lint.outputs.has_bench_paths }}
          BASE: ${{ needs.code-lint.outputs.validation_base }}
          MEASURED_BY_BOT: ${{ needs.code-lint.outputs.measured_by_bot }}
        run: |
          set -euo pipefail
          state=$(mktemp -d)
          reports=$REPORTS
          cache=$state/cache
          mkdir -p "$reports/test-reports" "$cache"

          export PYTHONDONTWRITEBYTECODE=1
          git config --global --add safe.directory '*'
          # AITER JIT-builds for these archs.
          GPU_ARCHS=$(python3 -c 'import torch; assert torch.version.hip and torch.cuda.is_available(), "no ROCm GPU"; print(";".join(sorted({torch.cuda.get_device_properties(i).gcnArchName.split(":")[0] for i in range(torch.cuda.device_count())})))')
          echo "🔧 GPU_ARCHS=$GPU_ARCHS"
          export GPU_ARCHS FLYDSL_RUNTIME_CACHE_DIR=$cache/flydsl-runtime FLYDSL_AUTOTUNE_CACHE_DIR=$cache/flydsl-autotune \
            TRITON_CACHE_DIR=$cache/triton XDG_CACHE_HOME=$cache/xdg AKLR_KERNEL_CACHE_DIR=$cache/aklr-kernels
          # Bench task directories need a local disk (peak len(devices) × 16 GiB): flock, atomic renames, real free space.
          export TMPDIR=$state

          if [[ -n ${AKLR_BASELINE_AITER:-} ]]; then
            echo '::group::Install the baseline AITER and AKLR'
            # Not aiter's default, its site-packages tree.
            export AITER_JIT_DIR=$cache/aiter-jit
            # Keep the image's Triton: otherwise aiter's setup.py swaps in the one it pins.
            image_triton=$(python3 -c 'import torch, triton; print(triton.__version__)')
            AITER_USE_SYSTEM_TRITON=1 python3 -m pip install "amd-aiter @ git+https://github.com/ROCm/aiter.git@$AKLR_BASELINE_AITER"
            python3 -m pip install -e .
            triton=$(python3 -c 'import torch, triton; print(triton.__version__)')
            [[ $triton == "$image_triton" ]] || { echo "::error::The image's Triton $image_triton became $triton"; exit 1; }
            # The aiter Python imports is the one just installed, not the image's copy on sys.path.
            python3 - <<'PY'
          import json
          import os
          from importlib.metadata import distribution, version
          from pathlib import Path
          import aiter
          dist = distribution("amd-aiter")
          installed = Path(dist.locate_file("aiter/__init__.py")).resolve()
          assert Path(aiter.__file__).resolve() == installed, aiter.__file__
          # pip's record of the commit it built: a release tag's version carries none
          commit = json.loads(dist.read_text("direct_url.json"))["vcs_info"]["commit_id"]
          assert commit == os.environ["AKLR_BASELINE_AITER"], commit
          print("amd-aiter", version("amd-aiter"), "at", installed)
          PY
          else
            echo '::group::Install AKLR'
            python3 -m pip install -e .
          fi
          echo '::endgroup::'

          echo '::group::Enable coverage and test tools'
          # Install coverage over any copy the image ships, so pip never has to uninstall it.
          python3 -m pip install --ignore-installed 'coverage[toml]==7.16.0'
          python3 -m pip install 'pytest-timeout==2.4.0' 'expecttest==0.3.0'
          site_packages=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo 'import coverage; coverage.process_startup()' > "$site_packages/coverage_subprocess.pth"
          export COVERAGE_FILE=$state/.coverage COVERAGE_PROCESS_START=$PWD/pyproject.toml
          echo '::endgroup::'

          echo "::group::Run unit tests ($TESTS)"
          tests=0
          # shellcheck disable=SC2086 # TESTS is a list of paths
          timeout -k 60s 25m python3 -m coverage run -m pytest -v $TESTS \
            --timeout=600 --timeout-method=thread \
            --junitxml="$reports/test-reports/aklr.xml" \
            2>&1 | tee "$reports/test-reports/aklr.log" || tests=$?
          echo '::endgroup::'
          # The coverage of failed tests is reported too. From here on its tracer would skew the measurements.
          unset COVERAGE_PROCESS_START
          python3 -m coverage combine --append "$state"
          cp "$COVERAGE_FILE" "$reports/coverage_data_$GITHUB_JOB"
          [[ $tests == 0 ]] || { echo "::error::Unit tests failed (exit $tests)"; exit "$tests"; }

          [[ ${VALIDATE:-} == true ]] || exit 0
          # The exit code is the conclusion; report.md's first line says which failure.
          flags=(${BASE:+--base "$BASE"})
          [[ ${MEASURED_BY_BOT:-} != true ]] || flags+=(--allow-measured-edits)
          if [[ -n ${AKLR_BASELINE_AITER:-} ]]; then
            echo '::group::Validate aklr/ops'
            # FIXME: mega_moe's baseline JIT-builds mori's device bitcode, which misses TheRock's
            # <libdrm/drm.h> (mori/jit/core.py::_collect_include_dirs, ROCm/mori 29e0c086); measure
            # mega_moe again once the image ships a mori that finds it.
            python3 -m aklr validate "${flags[@]}" --under aklr/ops --exclude aklr/ops/mega_moe \
              --out "$reports/validation-report"
          else
            : "${PLUGINS:?}"
            echo "::group::Validate plugins ($PLUGINS), check aklr/ops"
            plugins=0 ops=0
            # shellcheck disable=SC2086 # PLUGINS is a list of flags
            python3 -m aklr validate "${flags[@]}" $PLUGINS --out "$reports/validation-report" || plugins=$?
            python3 -m aklr validate "${flags[@]}" --under aklr/ops --no-timing --out "$reports/validation-check" || ops=$?
            exit $((plugins ? plugins : ops))
          fi
      - &finish_gpu_tests
        name: Delete the GPU workload or local container
        if: always()
        run: bash .github/scripts/gpu_job.sh delete
      - &upload_coverage
        name: Upload coverage (coverage-${{ github.job }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.job }}
          path: ${{ runner.temp }}/gpu-reports/coverage_data_${{ github.job }}
          if-no-files-found: warn
      - &upload_test_logs
        name: Upload test logs (unittest-${{ github.job }}-logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ github.job }}-logs
          path: ${{ runner.temp }}/gpu-reports/test-reports/
          if-no-files-found: warn
      - &summarize
        # The PR head the reviewer signs; the checkout is the merge commit.
        name: Summarize
        if: always() && needs.code-lint.outputs.has_bench_paths == 'true'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ -z $PR_HEAD ]] || echo "PR head: \`$PR_HEAD\`" >> "$GITHUB_STEP_SUMMARY"
          for report in "$RUNNER_TEMP"/gpu-reports/validation-*/report.md; do
            [[ ! -f $report ]] || cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - &upload_report
        name: Upload the validation report (validation-report-${{ github.job }}-<attempt>)
        if: always() && needs.code-lint.outputs.has_bench_paths == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpu-reports/validation-report/
          retention-days: 90

  # sglang-test: the sglang image as it ships, AKLR alone installed. Its plugins are timed against
  # sglang's own code; aklr/ops is built and checked only, its timing being aiter-test's.
  # aklr/plugins/vllm is vllm-test's.
  sglang-test:
    needs: code-lint
    if: needs.code-lint.outputs.gpu_enabled == 'true'
    runs-on: ${{ needs.code-lint.outputs.gpu_runner }}
    timeout-minutes: 480
    env:
      TIMEOUT_MINUTES: 150
      IMAGE: ${{ needs.code-lint.outputs.sglang_image }}
      TESTS: tests/plugins/aiter tests/plugins/sglang
      PLUGINS: --under aklr/plugins --exclude aklr/plugins/vllm
    steps:
      - *checkout_source
      - *gpu_tests
      - *finish_gpu_tests
      - *upload_coverage
      - *upload_test_logs
      - *summarize
      - *upload_report
      - &upload_check
        name: Upload the check of aklr/ops (validation-check-${{ github.job }}-<attempt>)
        if: always() && needs.code-lint.outputs.has_bench_paths == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-check-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gpu-reports/validation-check/
          retention-days: 90

  # vllm-test: the vllm image as it ships, AKLR alone installed. aklr/plugins/vllm is timed in it;
  # aklr/ops is built and checked only, as in sglang-test.
  vllm-test:
    needs: code-lint
    if: needs.code-lint.outputs.gpu_enabled == 'true'
    runs-on: ${{ needs.code-lint.outputs.gpu_runner }}
    timeout-minutes: 480
    env:
      TIMEOUT_MINUTES: 60
      IMAGE: ${{ needs.code-lint.outputs.vllm_image }}
      TESTS: tests/plugins/vllm
      PLUGINS: --under aklr/plugins/vllm
    steps:
      - *checkout_source
      - *gpu_tests
      - *finish_gpu_tests
      - *upload_coverage
      - *upload_test_logs
      - *summarize
      - *upload_report
      - *upload_check

  coverage-report:
    needs: [code-lint, aiter-test, sglang-test, vllm-test]
    # The required check: always runs, since a skipped job would satisfy one on its own.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Note missing coverage
        env:
          GPU_ENABLED: ${{ needs.code-lint.outputs.gpu_enabled }}
          TEST_RESULTS: ${{ needs.aiter-test.result }} ${{ needs.sglang-test.result }} ${{ needs.vllm-test.result }}
        run: |
          if [[ "$GPU_ENABLED" != true ]]; then
            echo '⏭️ GPU tests require the ci:gpu label; no coverage data was collected.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$TEST_RESULTS" != 'success success success' ]]; then
            echo "ℹ️ The test jobs ended $TEST_RESULTS. Merge the available data; coverage does not imply the tests passed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout source for coverage reports
        if: needs.code-lint.outputs.gpu_enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        if: needs.code-lint.outputs.gpu_enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coverage
        if: needs.code-lint.outputs.gpu_enabled == 'true'
        run: |
          echo "🧰 Install coverage 7.16.0, matching the test jobs'."
          python -m pip install 'coverage[toml]==7.16.0'
      - name: Download raw data from coverage-* artifacts
        if: needs.code-lint.outputs.gpu_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
      - name: Merge coverage data and generate reports
        id: merge
        if: needs.code-lint.outputs.gpu_enabled == 'true'
        run: |
          trap 'echo "⏱️ Coverage merge/report finished in ${SECONDS}s (exit $?)."' EXIT
          shopt -s nullglob
          data_files=(coverage-artifacts/coverage_data_*)
          if [[ ${#data_files[@]} -eq 0 ]]; then
            echo '⏭️ No coverage data found. Skip report generation.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "📥 Received ${#data_files[@]} raw coverage files:" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '  - %s\n' "${data_files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '📊 Combine raw data into one dataset before calculating line and branch coverage.'
          coverage combine "${data_files[@]}"
          echo '📋 Python coverage report (JIT kernel bodies are excluded):'
          coverage report
          echo '📝 Generate HTML, JSON and the module summary.'
          coverage html -d visual-coverage
          coverage json -o coverage.json
          python .github/scripts/coverage_summary.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'report_ready=true' >> "$GITHUB_OUTPUT"
          echo '✅ Reports generated: visual-coverage/index.html and coverage.json.'
      - name: Upload combined coverage report
        id: upload_combined
        if: always() && steps.merge.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-coverage
          path: |
            visual-coverage/
            coverage.json
          if-no-files-found: warn
      - name: Link coverage artifact in run summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload_combined.outputs.artifact-url }}
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            echo "📦 Full HTML report: download [visual-coverage]($ARTIFACT_URL), unzip and open visual-coverage/index.html." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Last, so the report is still produced when the gate fails.
      - name: Enforce the overall CI result
        if: always()
        env:
          LINT: ${{ needs.code-lint.result }}
          GPU_ENABLED: ${{ needs.code-lint.outputs.gpu_enabled }}
          GPU_RESULTS: ${{ needs.aiter-test.result }} ${{ needs.sglang-test.result }} ${{ needs.vllm-test.result }}
        run: |
          [[ $LINT == success ]] || { echo '::error::code-lint did not succeed'; exit 1; }
          [[ $GPU_ENABLED == true ]] || exit 0
          [[ $GPU_RESULTS == 'success success success' ]] ||
            { echo "::error::aiter-test, sglang-test, vllm-test: $GPU_RESULTS"; exit 1; }

  # Publishes a main push run's measurements through one rolling bot PR, aklr-perf/main
  # -> main; no GPU, never runs PR code. The artifact is untrusted: only measured-field
  # changes to schemas on main, only measurements still current on main. A failed
  # validation still writes (a demotion is a failure); write_schemas decides per schema.
  # The [skip ci] squash starts no run: squash-merge the bot PR only with its title as
  # the subject, otherwise main's push run fails with PERF_EDITED.
  # No job concurrency: main push runs already share the workflow group.
  publish-measurement:
    needs: [code-lint, aiter-test, sglang-test, vllm-test]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AKLR_BOT_LOGIN != '' &&
      (contains(fromJSON('["success", "failure"]'), needs.aiter-test.result) ||
       contains(fromJSON('["success", "failure"]'), needs.sglang-test.result) ||
       contains(fromJSON('["success", "failure"]'), needs.vllm-test.result))
    runs-on: ubuntu-latest
    environment: bot
    timeout-minutes: 20
    # Writes use the App token, not GITHUB_TOKEN.
    permissions:
      contents: read
      actions: read
      # gh pr checks reads the bot PR's checks with GITHUB_TOKEN.
      checks: read
      pull-requests: read
      statuses: read
    steps:
      - name: Mint the bot token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AKLR_BOT_APP_ID }}
          private-key: ${{ secrets.AKLR_BOT_PRIVATE_KEY }}
      - name: Checkout main
        uses: actions/checkout@v4  # zizmor: ignore[artipacked] the App token pushes the commit; nothing is uploaded
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          # The carry and the current rule read every Measured-SHA commit.
          fetch-depth: 0
      # export check and the current rule run main's aklr.
      - *setup_python
      - *install_cpu_deps
      # A missed measurement is not retried; the next aklr/core or stack.json change on main re-benches every schema.
      # A test job can fail before write_schemas: no artifact is nothing to write. aklr/ops is
      # aiter-test's, aklr/plugins/vllm vllm-test's, the rest of aklr/plugins sglang-test's (validate --under).
      - name: Download aiter-test's validation report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validation-report-aiter-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-report-aiter
      - name: Download sglang-test's validation report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validation-report-sglang-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-report-sglang
      - name: Download vllm-test's validation report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validation-report-vllm-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-report-vllm
      - name: Rebuild the bot branch
        id: commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT_LOGIN: ${{ vars.AKLR_BOT_LOGIN }}
          AITER_IMAGE: ${{ needs.code-lint.outputs.aiter_image }}
          SGLANG_IMAGE: ${{ needs.code-lint.outputs.sglang_image }}
          VLLM_IMAGE: ${{ needs.code-lint.outputs.vllm_image }}
        run: >-
          bash .github/scripts/publish_measurement.sh "$RUNNER_TEMP/validation-report-aiter"
          "$RUNNER_TEMP/validation-report-sglang" "$RUNNER_TEMP/validation-report-vllm"
      # An empty PREV leases on the branch not existing. A lost lease (a bot squash merged
      # and the branch was deleted mid-run) drops this run's values until the next publish-measurement.
      - name: Push and update the bot PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PREV: ${{ steps.commit.outputs.prev }}
        run: |
          if ! git push --force-with-lease="refs/heads/aklr-perf/main:$PREV" origin HEAD:refs/heads/aklr-perf/main; then
            echo '::warning::aklr-perf/main moved (merged or deleted) during this run; the next publish-measurement republishes'
            exit 0
          fi
          # The title carries [skip ci] into the default squash subject; set each run to follow the newest commit.
          title="$(git log -1 --format=%s) [skip ci]"
          if [[ $(gh pr list --head aklr-perf/main --base main --state open --json number --jq length) == 0 ]]; then
            gh pr create --base main --head aklr-perf/main --title "$title" \
              --body "Measurements published by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Squash-merge with the PR title."
          else
            gh pr edit aklr-perf/main --title "$title"
          fi
          # The bot bypasses main's review but not its required checks: merge once they pass,
          # and only the head this run pushed (a newer run may have pushed since).
          sleep 30  # shortcut: lets the checks register; a slower start just leaves the PR to the next run
          if GH_TOKEN=$GITHUB_TOKEN gh pr checks aklr-perf/main --required --watch --fail-fast; then
            gh pr merge aklr-perf/main --admin --squash --subject "$title" --match-head-commit "$(git rev-parse HEAD)" ||
              echo '::warning::Bot PR not merged; the next publish-measurement retries'
          else
            echo '::warning::Bot PR checks did not pass; left open for review'
          fi
