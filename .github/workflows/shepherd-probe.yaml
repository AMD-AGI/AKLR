name: shepherd-probe

# TEMPORARY, removed before merge: what the aklr-gpu runner and the App offer shepherd.yaml.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/shepherd-probe.yaml]

permissions: {}

jobs:
  app:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AKLR_CLAUDE_APP_ID }}
          private-key: ${{ secrets.AKLR_CLAUDE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - run: echo "the App grants contents read, issues and pull requests write"
  host:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: aklr-gpu
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set +e
          echo "user=$(id -un) home_ok=$(test -w "$HOME" && echo yes)"
          for tool in claude gh jq docker python3 git timeout; do
            printf '%s: ' "$tool"; command -v "$tool" || echo MISSING
          done
          python3 -c 'import sys, yaml; print("python", sys.version.split()[0], "yaml", yaml.__version__)'
          claude --version
          python3 -c 'import json, os; e = json.load(open(os.path.expanduser("~/.claude/settings.json"))).get("env", {}); print("claude settings keys:", sorted(k for k in e if k.startswith("ANTHROPIC")))'
          gh auth status 2>&1 | grep -c 'Logged in' | sed 's/^/gh logins: /'
          git config --global user.name > /dev/null && echo 'git identity set' || echo 'git identity MISSING'
          docker info --format 'docker {{.ServerVersion}}'
          ls /dev/dri | grep -c renderD | sed 's/^/render nodes: /'
          df -h --output=avail,target /var/tmp "$HOME" | sed 's/^/disk: /'
          curl -s -o /dev/null -m 10 -w 'llm endpoint http %{http_code}\n' https://llm-api.amd.com/
          docker ps --format '{{.Names}}' | wc -l | sed 's/^/running containers: /'
          exit 0
