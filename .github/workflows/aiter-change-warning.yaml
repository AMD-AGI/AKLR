name: AITER Change Warning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  # Each push must be inspected, even if a newer push arrives immediately.
  group: aiter-warning-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  inspect:
    name: AITER path warning (advisory)
    if: github.event_name != 'pull_request_target' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test warning behavior
        run: python -m unittest discover -s .github/scripts/tests -p 'test_warn_aiter_changes.py'
      - name: Inspect paths without running AITER code
        run: python .github/scripts/warn_aiter_changes.py github

  comment:
    name: AITER PR reminder (advisory)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # This privileged job executes only the trusted base's script. Fetching
      # PR Git objects below never checks out or executes PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update one PR comment and the AITER label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/warn_aiter_changes.py github --publish
