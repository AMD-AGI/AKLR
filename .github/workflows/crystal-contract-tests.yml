name: Crystal integration contract tests

on:
  pull_request:
    paths:
      - .github/workflows/crystal-*.yml
      - .github/scripts/*crystal*
      - .github/scripts/tests/*crystal*
      - stack.json
      - docker/Dockerfile.sglang
  push:
    branches: [main]
    paths:
      - .github/workflows/crystal-*.yml
      - .github/scripts/*crystal*
      - .github/scripts/tests/*crystal*
      - stack.json
      - docker/Dockerfile.sglang

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s .github/scripts/tests -v
      - run: node --test .github/scripts/tests/*.test.cjs
