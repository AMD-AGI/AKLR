name: AKLR-agentx-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 10 * * 5'
  workflow_dispatch:
    inputs:
      models:
        description: Enabled model ids, comma-separated, or all
        type: string
        default: all
      targets:
        description: Enabled target ids in selected models, comma-separated, or all (runs execute serially)
        type: string
        default: all
      frameworks:
        description: Enabled serving frameworks (sglang, vllm) in selected targets, comma-separated, or all
        type: string
        default: all
      points:
        description: ARM:CONC points from the recipe serving.<model>.json (single model/target/framework smoke runs)
        type: string
        default: ''
      duration_s:
        description: DURATION per point for a smoke run (empty = the recipe's)
        type: string
        default: ''
      publish:
        description: Publish the measured targets to the site (scheduled runs always do)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Ignored PR events and refused manual runs must not replace a requested run waiting for the
  # GPU runner. The allowlist here must match benchmarks/agentx/allowlist.yaml (a test checks it);
  # the plan job still authorizes against main's allowlist.yaml.
  group: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci:agentx-mi355x') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:agentx-mi355x') &&
        format('agentx-pr-{0}', github.event.pull_request.number) ||
        github.event_name == 'pull_request' && format('agentx-ignored-{0}', github.run_id) ||
        github.event_name == 'workflow_dispatch' &&
        (github.ref != 'refs/heads/main' ||
         !contains(fromJSON('["RuibinCheung", "xiaobochen-amd", "jiejingzhangamd", "zhenhuang12", "kyle-256"]'),
                   github.triggering_actor)) &&
        format('agentx-refused-{0}', github.run_id) ||
        'agentx-weekly' }}
  # A new commit on a labeled PR supersedes its running AgentX run; ignored PR events have a
  # group of their own, and scheduled and manual runs still queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: benchmarks/agentx

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    if: >-
      (github.event_name != 'schedule' || vars.AGENTX_SCHEDULE_ENABLED == 'true') &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci:agentx-mi355x') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:agentx-mi355x')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      skipped: ${{ steps.resolve.outputs.skipped }}
      # "Re-run failed jobs" reuses this plan without its checks; later jobs need this attempt's plan.
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Read main's AgentX allowlist
        # Authorize against main, not the checked-out copy a PR or an older commit can carry.
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/benchmarks/agentx/allowlist.yaml?ref=main" > "$RUNNER_TEMP/allowlist.yaml"
      - name: Read the PR comments that may authorize AgentX
        # Read them now rather than from the event, so a re-run after a reviewer's comment uses it.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | {user: .user.login, body: (.body // ""), url: .html_url}' | jq -s . > "$RUNNER_TEMP/pr-comments.json"
      - name: Plan selected model/target/framework runs from recipe files
        id: resolve
        env:
          MODELS: ${{ inputs.models || 'all' }}
          TARGETS: ${{ inputs.targets || 'all' }}
          FRAMEWORKS: ${{ inputs.frameworks || 'all' }}
          RUNNER_LABEL: ${{ github.event_name != 'workflow_dispatch' && 'agentx-mi355x' || '' }}
          POINTS: ${{ inputs.points }}
          DURATION_S: ${{ github.event_name == 'pull_request' && '600' || inputs.duration_s }}
          # Verify the recipe duration without a smoke override, preserving baseline eligibility.
          REQUIRE_RECIPE_DURATION: ${{ github.event_name == 'schedule' && '3600' || '' }}
          PR_COMMENTS: ${{ github.event_name == 'pull_request' && 'pr-comments.json' || '' }}
          # A manual run needs an allowlisted reviewer (who clicked Run or Re-run) and main.
          MANUAL_ACTOR: ${{ github.event_name == 'workflow_dispatch' && github.triggering_actor || '' }}
          ALLOWLIST: ${{ github.event_name != 'schedule' && 'allowlist.yaml' || '' }}
        run: |
          python3 -m agentx_bench plan --models "$MODELS" --targets "$TARGETS" --frameworks "$FRAMEWORKS" \
            ${RUNNER_LABEL:+--runner-label "$RUNNER_LABEL"} \
            ${POINTS:+--points "$POINTS"} ${DURATION_S:+--duration "$DURATION_S"} \
            ${REQUIRE_RECIPE_DURATION:+--require-recipe-duration "$REQUIRE_RECIPE_DURATION"} \
            ${PR_COMMENTS:+--pr-comments "$RUNNER_TEMP/$PR_COMMENTS"} \
            ${MANUAL_ACTOR:+--manual-actor "$MANUAL_ACTOR" --manual-ref "$GITHUB_REF"} \
            ${ALLOWLIST:+--allowlist "$RUNNER_TEMP/$ALLOWLIST"} \
            --out "$RUNNER_TEMP/plan"
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.skipped != 'true'
        with:
          name: agentx-plan
          path: ${{ runner.temp }}/plan/

  sweep:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' && needs.plan.outputs.attempt == github.run_attempt }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2520
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: agentx-plan
          path: ${{ runner.temp }}/plan
      - name: Sweep one model/target/framework run
        # Partial measurements succeed; the step summary retains failed point counts.
        env:
          MODEL_ID: ${{ matrix.model }}
          TARGET_ID: ${{ matrix.target }}
          FRAMEWORK_ID: ${{ matrix.framework }}
          HF_HUB_DIR: ${{ vars.AGENTX_HF_HUB_DIR }}
        # exec: a cancelled run's SIGINT must reach the sweep, which then stops its container.
        run: |
          run="models/$MODEL_ID/targets/$TARGET_ID/frameworks/$FRAMEWORK_ID"
          exec python3 -m agentx_bench sweep --serving "$RUNNER_TEMP/plan/$run/serving.json" \
            --hub "$HF_HUB_DIR" --run-id "$GITHUB_RUN_ID" --cache "$RUNNER_TEMP/aklr-cache/$run" \
            --work "$RUNNER_TEMP/agentx/$run" --out "$RUNNER_TEMP/results/$run"
      - name: Remove the sweep container left by a cancelled run
        # The runner kills the sweep 10 s after cancelling, which can be before its own cleanup ends.
        if: always()
        env:
          MODEL_ID: ${{ matrix.model }}
          TARGET_ID: ${{ matrix.target }}
          FRAMEWORK_ID: ${{ matrix.framework }}
        run: |
          out=$(realpath -m "$RUNNER_TEMP/results/models/$MODEL_ID/targets/$TARGET_ID/frameworks/$FRAMEWORK_ID")
          docker ps --all --quiet --filter "label=agentx.out=$out" | xargs --no-run-if-empty docker rm --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentx-results-${{ matrix.job_index }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore

  report:
    needs: [plan, sweep]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skipped != 'true' &&
          needs.plan.outputs.attempt == github.run_attempt }}
    outputs:
      site_ready: ${{ steps.site_artifact.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Commit comparisons need full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: agentx-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        id: download_results
        if: needs.plan.outputs.count != '0'
        continue-on-error: true # Early failures may produce no artifact.
        with:
          pattern: agentx-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      # Only this run: no previous site or baselines are read, so nothing is compared across runs.
      - name: Render this run's target reports and index
        run: |
          python3 -m agentx_bench report --plan "$RUNNER_TEMP/plan/manifest.json" \
            --results "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@v4
        id: site_artifact
        with:
          name: agentx-site
          path: ${{ runner.temp }}/site/
      - name: Summarize and check target outcomes after saving reports
        # Sweep owns measurement failures; plan and report errors must still fail CI.
        env:
          RESULTS_DOWNLOAD_OUTCOME: ${{ steps.download_results.outcome }}
        run: |
          jq -r '.targets[] | "\(.model.id)/\(.target.id)/\(.framework.id): \(.status), \(.points_ok)/\(.points_total) paired points OK"' \
            "$RUNNER_TEMP/site/manifest.json"
          jq -e 'all(.targets[]; .failure_stage == null)' "$RUNNER_TEMP/site/manifest.json"
          test "$RESULTS_DOWNLOAD_OUTCOME" != failure

  # Every result on the site comes from main: a PR run (the ci:agentx-mi355x label) only uploads
  # agentx-site. The agentx-bot environment holds the aklr-agentx-ci App key and deploys only from
  # main; site.yaml then deploys site-data to Pages after this workflow completes.
  publish:
    needs: report
    if: >-
      ${{ !cancelled() && needs.report.outputs.site_ready == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    environment: agentx-bot
    timeout-minutes: 15
    # Writes use the App token, not GITHUB_TOKEN.
    permissions:
      contents: read
    # Every CI that writes site-data shares this group.
    concurrency:
      group: site-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Detached at this run's commit, so checkout leaves origin/main at main's tip for the check below.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that this run measured a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: agentx-site
          path: ${{ runner.temp }}/site
      - name: Mint the bot token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AKLR_AGENTX_BOT_APP_ID }}
          private-key: ${{ secrets.AKLR_AGENTX_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Replace this run's targets in site-data/agentx
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT_LOGIN: ${{ vars.AKLR_AGENTX_BOT_LOGIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash ../../.github/scripts/commit_site_data.sh agentx \
            "agentx: publish run $GITHUB_RUN_ID of ${GITHUB_SHA::12}" \
            python3 -m agentx_bench publish --site "$RUNNER_TEMP/site" --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" --section
