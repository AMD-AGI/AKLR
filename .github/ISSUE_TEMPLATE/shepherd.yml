name: shepherd request
description: Ask shepherd to optimize AKLR schemas. Only members of the shepherd requesters team are served.
title: "shepherd: "
body:
  - type: markdown
    attributes:
      value: |
        shepherd labels this issue and replies in one progress comment. Editing the request changes only
        campaigns not yet started; closing the issue stops running ones. Its PRs say `Refs #<this issue>`.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: "Parsed by shepherd. Keys: schemas (required), max_prs (default 1), max_campaigns (default: one per schema)."
      render: yaml
      value: |
        schemas:
          - aklr/ops/gemm/impls/flydsl/<name>/<hash>.json
        max_prs: 1
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Free text for shepherd's round agent about these campaigns. It cannot raise budgets or permissions.
