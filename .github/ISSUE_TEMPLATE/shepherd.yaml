name: Kernel optimization request (shepherd)
description: Tell shepherd which kernels to optimize. It runs only when an allowed user opens or labels the issue.
title: 'shepherd: '
labels: [shepherd]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: >-
        What to optimize, in your own words or as repository-relative schema JSON paths on main. The text
        is frozen when an allowed user labels the issue: later edits have no effect, and it cannot change
        budgets or rules. Closing the issue stops the request.
      placeholder: Optimize aklr/ops/gemm/impls/flydsl/<name>/<file>.json, the small-M regime first.
    validations:
      required: true
