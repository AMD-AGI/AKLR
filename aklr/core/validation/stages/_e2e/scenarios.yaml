# The e2e stage's scenarios: model steps of aklr/benchmarks/models/main.py, aklr on against off
defaults:
  n_runs_per_side: 6
  timeout_seconds: 3600
  # TODO: 1% is provisional, uncalibrated: set it above each scenario's off-against-off noise on the target
  min_gain_fraction: 0.01

scenarios:
  # GLM-5.2 MXFP4 decode at concurrency 1, where the kernels' gain shows
  - name: glm52-decode-tp8-conc1
    model: glm52
    phase: decode
    tp: 8  # plain TP: --CONC must divide by dp_size
    input_length: 100000
    concurrency: 1
    n_runs_per_side: 2  # the fewest rounds ratio_lower_bound accepts: fast, at the cost of a wider bound
    extra_args:  # no attention-backend flag: aiter there disables GLM-5.2's sparse attention
      mem-fraction-static: 0.6  # no DP attention: the indexer's chunk x context scores take 6.5 GB at 100k
    env:
      SGLANG_USE_AITER: "1"

  # DeepSeek-V4-Flash decode at concurrency 1, 2 and 4, the batches the sparse MLA kernels target
  - name: deepseekv4-flash-decode-tp8-conc1
    model: deepseekv4
    phase: decode
    tp: 8  # default pool flags: attention workloads hold the n_pages these runs allocate (12153 on MI355X)
    input_length: 100000
    concurrency: 1
    n_runs_per_side: 2
    env:
      AITER_BF16_FP8_MOE_BOUND: "16"
  - name: deepseekv4-flash-decode-tp8-conc2
    model: deepseekv4
    phase: decode
    tp: 8
    input_length: 100000
    concurrency: 2
    n_runs_per_side: 2
    env:
      AITER_BF16_FP8_MOE_BOUND: "16"
  - name: deepseekv4-flash-decode-tp8-conc4
    model: deepseekv4
    phase: decode
    tp: 8
    input_length: 100000
    concurrency: 4
    n_runs_per_side: 2
    env:
      AITER_BF16_FP8_MOE_BOUND: "16"

  # Kimi-K3 decode at concurrency 1 and 2 on the K3 cookbook's MI355X recipe (kimi_k3/README.md)
  - name: kimi-k3-decode-tp8-conc1
    model: kimi_k3
    phase: decode
    tp: 8  # not DCP8: at --CONC 1 and 2 TP8's step is faster and its KV pool holds 16 requests at 100k
    input_length: 100000
    concurrency: 1
    n_runs_per_side: 2
    extra_args:
      prefill-attention-backend: aiter
      decode-attention-backend: aiter
      mem-fraction-static: 0.85
    env:
      SGLANG_USE_AITER: "1"
      SGLANG_AITER_K3_OPT: "1"
      AITER_FLYDSL_FORCE: "1"
      AITER_SITUV2_A8W4: "1"
      # keeps 0.85, else scaled to 0.7225 under aiter at long context: too little for 194 GB/rank of weights
      SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: "1"
  - name: kimi-k3-decode-tp8-conc2
    model: kimi_k3
    phase: decode
    tp: 8
    input_length: 100000
    concurrency: 2
    n_runs_per_side: 2
    extra_args:
      prefill-attention-backend: aiter
      decode-attention-backend: aiter
      mem-fraction-static: 0.85
    env:
      SGLANG_USE_AITER: "1"
      SGLANG_AITER_K3_OPT: "1"
      AITER_FLYDSL_FORCE: "1"
      AITER_SITUV2_A8W4: "1"
      SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION: "1"
