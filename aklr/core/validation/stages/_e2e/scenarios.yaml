# E2E scenarios: which sglang cookbook recipes to serve, AKLR off and on.
# Each item of a model's cookbook.matches is a scenario of its own, named
# <model>-<the match values>; a PD item gives a prefill and a decode match.
# env and args apply over each cell's own (args: replaced by name, null removes, true is a
# switch); written as {prefill: ..., decode: ...} they apply per role. nnodes (one count, or one
# per role) replaces a cell's, which some multi-node cells leave out.
cookbook:
  repo: sgl-project/sglang
  source: main  # branch, tag, SHA, or a local sglang checkout
hosts: [127.0.0.1]  # node 0 first; local processes on the runner, SSH for remote hosts
work_dir: null  # temporary files under this existing directory; null uses the system temp directory
# For multiple hosts, work_dir and the checkout must be shared at the same paths.
models:
  glm52-fp4:
    enabled: true
    display_name: GLM-5.2 MXFP4
    cookbook:
      config: zai-org/glm-5.2  # docs/src/snippets/configs/<this>.jsx
      matches:
        - {hw: mi355x, variant: default, quant: mxfp4, strategy: low-latency, nodes: single}
    weights:  # the launcher sets --model-path, --tokenizer-path and --revision (required) from these
      repo: amd/GLM-5.2-MXFP4
      revision: 386bd0e4ec821f7b07975701cec3c3b953a5576a
    env:
      AKLR_SGLANG_PLUGIN: "1"
    args:  # a page toggle in the cookbook, not in the cell: the reasoning stays out of content
      --reasoning-parser: glm45
