<svg xmlns="http://www.w3.org/2000/svg" width="960" height="562" viewBox="0 0 960 562">
<style>
  .bg{fill:none}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,"DejaVu Sans",sans-serif;fill:#1f2328}
  .t{font-size:15px;font-weight:600}
  .s{font-size:12.5px;fill:#59636e}
  .sec{font-size:13px;font-weight:600;fill:#59636e;letter-spacing:.06em}
  .box{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.2}
  .hl{fill:#eef6ff;stroke:#0969da;stroke-width:2}
  .cont{fill:#eef6ff}
  .in{fill:#ffffff}
  .ok{fill:#dafbe1;stroke:#4ac26b}
  .fb{fill:#fff8c5;stroke:#d4a72c}
  .pl{stroke-dasharray:5 4}
  .ln{stroke:#818b98;stroke-width:1.6;fill:none}
  .ah{fill:#818b98}
  .grid{stroke:#d1d9e0;stroke-width:1}
  .axis{stroke:#818b98;stroke-width:1}
  .tick{font-size:12px;fill:#59636e}
  .a{stroke:#0969da;stroke-width:2.5;fill:none}
  .b{stroke:#8c959f;stroke-width:2.5;fill:none}
  .ad{fill:#0969da}.bd{fill:#8c959f}
  .ref{stroke:#59636e;stroke-width:1.2;stroke-dasharray:5 4}
  .note{font-size:13px}
  .na{fill:#0969da}.nb{fill:#59636e}
  @media (prefers-color-scheme: dark){
    text{fill:#f0f6fc}
    .s,.sec,.tick{fill:#9198a1}
    .box{fill:#151b23;stroke:#3d444d}
    .hl{fill:#0d1d33;stroke:#4493f8}
    .cont{fill:#0d1d33}
    .in{fill:#0d1117}
    .ok{fill:#0f2d1a;stroke:#2ea043}
    .fb{fill:#2e2a12;stroke:#9e6a03}
    .ln,.axis{stroke:#9198a1}.ah{fill:#9198a1}
    .grid{stroke:#3d444d}
    .a{stroke:#4493f8}.ad,.na{fill:#4493f8}
    .b{stroke:#7d8590}.bd{fill:#7d8590}.nb{fill:#9198a1}
    .ref{stroke:#9198a1}
  }
</style>
